name: Relay PoC Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/relay/**"
      - "packages/server/src/server/daemon-e2e/relay-*.ts"
      - "docs/vibes-relay-poc.md"
      - ".github/workflows/relay-poc.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci --workspace=@getpaseo/relay --include-workspace-root

      - name: Test Cloudflare Relay PoC
        run: >-
          npx vitest run
          packages/relay/src/cloudflare-policy.test.ts
          packages/relay/src/cloudflare-adapter.test.ts
          packages/relay/src/cloudflare-poc-safety.test.ts
          packages/relay/src/encrypted-channel.test.ts
          --bail=1

      - name: Local black-box Relay matrix
        working-directory: packages/relay
        run: |
          npm exec --offline -- wrangler dev \
            --local --ip 127.0.0.1 --port 8790 \
            --live-reload=false --show-interactive-dev-session=false \
            --var PASEO_RELAY_POC_MODE:local \
            --var PASEO_RELAY_ALLOWED_HOSTS:127.0.0.1 \
            > /tmp/vibes-relay-poc-wrangler.log 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8790/ready >/dev/null; then break; fi
            if [ "$attempt" = 120 ]; then exit 1; fi
            sleep 0.25
          done
          npm run poc:matrix -- \
            --target do-ci-local \
            --base-url http://127.0.0.1:8790 \
            --run-id do-ci-local

      - name: Typecheck
        run: npm run typecheck --workspace=@getpaseo/relay

      - name: Build
        run: npm run build --workspace=@getpaseo/relay

      - name: Cloudflare dry run
        working-directory: packages/relay
        run: npm exec --offline -- wrangler deploy --dry-run --outdir ../../.relay-poc-dry-run
