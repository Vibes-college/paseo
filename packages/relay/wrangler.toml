name = "vibes-paseo-relay-do-poc"
main = "src/cloudflare-adapter.ts"
compatibility_date = "2026-07-02"
workers_dev = false
preview_urls = false

# Safe checked-in state. Local tests override these values explicitly.
# An isolated Cloudflare Preview must use mode=preview, an exact host allowlist,
# and a RATE_LIMITER binding before /ready or /ws can pass.
[vars]
PASEO_RELAY_POC_MODE = "disabled"
PASEO_RELAY_ALLOWED_HOSTS = ""

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]
